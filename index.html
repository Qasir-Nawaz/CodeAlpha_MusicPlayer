<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatDrop - Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-container">
        <div class="top-bar">
            <button id="minimize"><i class="fas fa-chevron-down"></i></button>
            <div class="now-playing-text">NOW PLAYING</div>
            <button id="menu"><i class="fas fa-bars"></i></button>
        </div>

        <div class="track-details">
            <img id="track-art" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=500" alt="Album Art">
            <h2 id="track-title">sofi song</h2>
            <p id="track-artist">Sufi Track 1</p>
        </div>

        <div class="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" min="0" max="100" value="0">
            <span id="total-duration">0:00</span>
        </div>

        <div class="controls">
            <button id="shuffle"><i class="fas fa-random"></i></button>
            <button id="prev"><i class="fas fa-step-backward"></i></button>
            <button id="play-pause"><i class="fas fa-play"></i></button>
            <button id="next"><i class="fas fa-step-forward"></i></button>
            <button id="repeat"><i class="fas fa-redo"></i></button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
